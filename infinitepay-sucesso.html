<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento InfinitePay</title><style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#fff;padding:28px;border-radius:20px;box-shadow:0 20px 60px rgba(20,35,70,.12)}h1{margin-top:0}.status{padding:14px;border-radius:12px;font-weight:700;background:#f3f5f9}.ok{background:#e9fbef;color:#08783f}.err{background:#fff0f0;color:#a51e1e}.small{color:#748095;font-size:13px;line-height:1.5}.btn{display:none;margin-top:16px;background:#0a8f4f;color:#fff;text-decoration:none;text-align:center;padding:14px 18px;border-radius:12px;font-weight:800}.box{margin-top:16px;background:#f4f6fa;padding:14px;border-radius:12px;word-break:break-word;font-family:monospace;font-size:13px}</style></head><body><main class="wrap"><section class="card"><h1>Confirmação InfinitePay</h1><div id="status" class="status">Verificando o pagamento diretamente na InfinitePay...</div><a id="download" class="btn">Baixar arquivo teste</a><p class="small">O botão só aparece se a API da InfinitePay confirmar que este pedido de R$ 1,00 foi realmente pago.</p><div id="details" class="box"></div></section></main><script>
const p=new URLSearchParams(location.search);
const payload={handle:p.get('handle'),order_nsu:p.get('order_nsu'),transaction_nsu:p.get('transaction_nsu'),slug:p.get('slug')};
const statusBox=document.getElementById('status'),download=document.getElementById('download'),details=document.getElementById('details');
(async()=>{try{
 if(!payload.handle||!payload.order_nsu||!payload.transaction_nsu||!payload.slug) throw new Error('A InfinitePay não devolveu todos os dados necessários para validar este pagamento.');
 const r=await fetch('/api/infinitepay-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
 const data=await r.json();
 details.textContent=JSON.stringify(data,null,2);
 if(!r.ok) throw new Error(data.error||'Não foi possível verificar o pagamento.');
 if(data.validForDownload){
  statusBox.textContent='Pagamento de R$ 1,00 confirmado pela InfinitePay. Download liberado!';statusBox.className='status ok';
  const q=new URLSearchParams(payload);download.href='/api/infinitepay-download?'+q.toString();download.style.display='block';
 }else{
  statusBox.textContent='Pagamento ainda não confirmado ou valor diferente de R$ 1,00. Download bloqueado.';statusBox.className='status err';
 }
}catch(e){statusBox.textContent=e.message;statusBox.className='status err';details.textContent='';}})();
</script></body></html>
