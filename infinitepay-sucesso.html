<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retorno InfinitePay</title><style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#fff;padding:28px;border-radius:20px;box-shadow:0 20px 60px rgba(20,35,70,.12)}h1{margin-top:0}.ok{background:#e9fbef;color:#08783f;padding:14px;border-radius:12px;font-weight:700}.box{margin-top:16px;background:#f4f6fa;padding:14px;border-radius:12px;word-break:break-word;font-family:monospace;font-size:13px}.small{color:#748095;font-size:13px;line-height:1.5}</style></head><body><main class="wrap"><section class="card"><h1>Retorno da InfinitePay</h1><div class="ok">O checkout redirecionou de volta para o seu site.</div><p class="small">Abaixo estão os parâmetros devolvidos pela InfinitePay. Para liberar um produto de verdade, ainda devemos confirmar o pagamento pelo endpoint payment_check ou por webhook.</p><div id="params" class="box"></div></section></main><script>const p=new URLSearchParams(location.search);const obj={};for(const [k,v] of p.entries())obj[k]=v;document.getElementById('params').textContent=JSON.stringify(obj,null,2);</script></body></html>
